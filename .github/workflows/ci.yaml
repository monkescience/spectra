name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.11.4 # renovate: datasource=github-releases depName=golangci/golangci-lint

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: make test

      - name: Build
        run: make build

      - name: Coverage summary
        if: github.event_name == 'push'
        run: |
          COVERAGE=$(go tool cover -func=tests/coverage/coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "## Coverage" >> $GITHUB_STEP_SUMMARY
          echo "**Total:** ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY

      - name: Coverage delta
        if: github.event_name == 'pull_request'
        run: |
          PR_COVERAGE=$(go tool cover -func=tests/coverage/coverage.out | grep total | awk '{print $3}' | sed 's/%//')

          git stash --include-untracked || true
          git checkout ${{ github.base_ref }}
          make test 2>/dev/null || true
          mv tests/coverage/coverage.out tests/coverage/base_coverage.out 2>/dev/null || true

          if [ -f tests/coverage/base_coverage.out ]; then
            BASE_COVERAGE=$(go tool cover -func=tests/coverage/base_coverage.out | grep total | awk '{print $3}' | sed 's/%//' || echo "0")
          else
            BASE_COVERAGE="0"
          fi

          DELTA=$(echo "$PR_COVERAGE - $BASE_COVERAGE" | bc -l)
          DELTA_SIGN=""
          if (( $(echo "$DELTA > 0" | bc -l) )); then
            DELTA_SIGN="+"
          fi

          echo "## Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | Coverage | Delta |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Base (\`${{ github.base_ref }}\`) | ${BASE_COVERAGE}% | |" >> $GITHUB_STEP_SUMMARY
          echo "| PR | ${PR_COVERAGE}% | ${DELTA_SIGN}${DELTA}% |" >> $GITHUB_STEP_SUMMARY

          if (( $(echo "$PR_COVERAGE < $BASE_COVERAGE" | bc -l) )); then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> [!CAUTION]" >> $GITHUB_STEP_SUMMARY
            echo "> Coverage decreased by ${DELTA}%" >> $GITHUB_STEP_SUMMARY
            echo "::error::Coverage decreased from ${BASE_COVERAGE}% to ${PR_COVERAGE}% (${DELTA}%)"
            exit 1
          elif (( $(echo "$DELTA > 0" | bc -l) )); then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> [!TIP]" >> $GITHUB_STEP_SUMMARY
            echo "> Coverage increased by ${DELTA_SIGN}${DELTA}%" >> $GITHUB_STEP_SUMMARY
          fi
